name: Paddock F1 Telemetry CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run TypeScript Type Check
        run: npx tsc --noEmit

      - name: Run Vitest Unit & Integration Tests
        run: npm test

      - name: Validate Next.js Production Build
        run: npm run build
        env:
          JWT_SECRET: "paddock-f1-telemetry-server-secure-key-2026"
          NEXT_PUBLIC_SUPABASE_URL: "https://qqowghzkyqsqxkneconx.supabase.co"
          NEXT_PUBLIC_SUPABASE_ANON_KEY: "sb_publishable_yobiwP8hSkvTN8CmosqDEg__tXRmo7y"
